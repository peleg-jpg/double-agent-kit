<!doctype html>
<html lang="he">
  <!-- no dir="rtl" on <html>: HyperFrames renders a blank video with it. Each scene sets dir="rtl" itself. -->
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Explainer</title>
    <link rel="icon" href="data:," />
    <!-- Hebrew fonts from local npm packages (offline, deterministic). Hebrew + Latin subsets. -->
    <link
      rel="stylesheet"
      href="node_modules/@fontsource/secular-one/400.css"
    />
    <link rel="stylesheet" href="node_modules/@fontsource/heebo/400.css" />
    <link rel="stylesheet" href="node_modules/@fontsource/heebo/500.css" />
    <link rel="stylesheet" href="node_modules/@fontsource/heebo/600.css" />
    <link rel="stylesheet" href="node_modules/@fontsource/heebo/700.css" />
    <link rel="stylesheet" href="node_modules/@fontsource/heebo/800.css" />
    <link rel="stylesheet" href="node_modules/@fontsource/heebo/900.css" />
    <link rel="stylesheet" href="node_modules/@fontsource/rubik/500.css" />
    <link rel="stylesheet" href="node_modules/@fontsource/rubik/600.css" />
    <link rel="stylesheet" href="node_modules/@fontsource/rubik/700.css" />
    <link rel="stylesheet" href="node_modules/@fontsource/rubik/800.css" />
    <link rel="stylesheet" href="node_modules/@fontsource/assistant/600.css" />
    <link rel="stylesheet" href="node_modules/@fontsource/assistant/800.css" />
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="main"
      data-start="0"
      data-duration="13.5"
      data-width="1080"
      data-height="1920"
    ></div>
    <div id="font-warm" aria-hidden="true">
      <span style="font-family: &quot;Secular One&quot;">אבג Abc 123</span>
      <span style="font-family: Heebo; font-weight: 400">אבג Abc 123</span>
      <span style="font-family: Heebo; font-weight: 500">אבג Abc 123</span>
      <span style="font-family: Heebo; font-weight: 600">אבג Abc 123</span>
      <span style="font-family: Heebo; font-weight: 700">אבג Abc 123</span>
      <span style="font-family: Heebo; font-weight: 800">אבג Abc 123</span>
      <span style="font-family: Heebo; font-weight: 900">אבג Abc 123</span>
      <span style="font-family: Rubik; font-weight: 500">אבג Abc 123</span>
      <span style="font-family: Rubik; font-weight: 600">אבג Abc 123</span>
      <span style="font-family: Rubik; font-weight: 700">אבג Abc 123</span>
      <span style="font-family: Rubik; font-weight: 800">אבג Abc 123</span>
      <span style="font-family: Assistant; font-weight: 600">אבג Abc 123</span>
      <span style="font-family: Assistant; font-weight: 800">אבג Abc 123</span>
    </div>
    <script src="node_modules/gsap/dist/gsap.min.js"></script>
    <script src="video-data.js"></script>
    <script src="src/palettes.js"></script>
    <script src="src/text.js"></script>
    <script src="src/glyphs.js"></script>
    <script src="src/scenes/counter.js"></script>
    <script src="src/scenes/list.js"></script>
    <script src="src/scenes/logos.js"></script>
    <script src="src/scenes/ui-click.js"></script>
    <script src="src/scenes/before-after.js"></script>
    <script src="src/scenes/quote.js"></script>
    <script src="src/engine.js"></script>
    <script>
      // HyperFrames timeline contract (engine.js builds it synchronously)
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = window.__mainTimeline;
    </script>
  </body>
</html>
